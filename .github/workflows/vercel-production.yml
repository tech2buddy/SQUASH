name: Deploy to Vercel (Production)

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Vercel secrets
        shell: bash
        run: |
          missing=0
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error title=Missing VERCEL_TOKEN::Add VERCEL_TOKEN in GitHub repo Settings > Secrets and variables > Actions."
            missing=1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error title=Missing VERCEL_ORG_ID::Add VERCEL_ORG_ID in GitHub repo Settings > Secrets and variables > Actions."
            missing=1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error title=Missing VERCEL_PROJECT_ID::Add VERCEL_PROJECT_ID in GitHub repo Settings > Secrets and variables > Actions."
            missing=1
          fi
          exit $missing

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Project Artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
